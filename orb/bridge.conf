{
  "_comment": "后台相关开关。daemon 可在 ORB 控制台状态栏的「热启动」按钮里实时切换（bridge 即时写回本文件，无需重启）；手动改本文件亦生效。",
  "daemon": false,
  "_daemon_note": "热启动（常驻 daemon）总开关。true=后台优先走常驻 codebuddy --serve，消掉每次冷启动；false=每次直接用 -p 子进程（最稳，冷启动稍慢）。本机 CLI 构建里 daemon 两条路线（ACP / --serve 回调）实测都不稳定：开启后后台任务会先等约 90s 回调、不来再回落 -p，反而更慢。建议保持 false；登录成功、想试热启动时再改 true。"
}
