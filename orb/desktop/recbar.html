<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:19387">
<title>ORB 录制控制</title>
<style>
  /* ==================================================================
     悬浮录屏控制条（v2：纱质皮肤 + 能量条自动收起）
     ------------------------------------------------------------------
     为什么单独一个窗口而不是把按钮画在面板里：录制一开始面板就会隐藏
     （否则录出来的画面里全是 ORB 自己），面板一隐藏它的渲染进程定时器
     就会被 Chromium 节流，计时器会越走越慢 —— 所以控制键和计时器
     必须落在自己这个常驻可见的窗口上。

     v2 相比 v1（320×64 不透明深色 pill）：
       ① 窗口改 transparent，底衫交给 pill 自己画 —— 玻璃/纱质感
          必须先有透明窗口，把 #12162b 底涂去掉才成立；
       ② 两套皮肤：灰白纱（默认）与深纱（实时字幕同款配方），
          用户在 设置 › 录屏 里选，主进程经 rec:cfg 推进来；
       ③ 能量条：开始录制 2.6s 无操作自动收成细条（只动 transform /
          opacity，窗口尺寸不变），悬停展开；收起时经主进程把窗口切
          点击穿透，细条只被"看见"，不会挡住背后的最大化/标签页。
     ================================================================== */
  :root {
    --ease: cubic-bezier(.22,.61,.36,1);
    --dur-1: .14s;                        /* 微交互：hover / active */
    --dur-2: .22s;                        /* 标准：状态切换 / 能量条收展 */
    --dur-3: .32s;                        /* 入场 */
    /* 能量条收起态的缩放比：.skin / #glassbg / .mini 三处引用同一组值。
       抽成变量是因为这三层必须"同一个数"：纱缩多少、玻璃就缩多少、
       .mini 的盒子也得按同一个数算 —— 以前 .78/.34 在两条规则里各写一遍，
       改一处忘一处就是错位的来源。
       命名刻意避开 energy 前缀：那属于 panel 侧的令牌族（t1/t2 能量色），
       _recbar_verify 有一条红线断言「recbar.html 不得出现 energy 变量」。 */
    --shrink-x: .78;
    --shrink-y: .34;
    /* .skin / #glassbg 到窗口边的呼吸边，等于那两条规则里的 `inset: 4px`。
       那两处保留字面量（读起来更直白，也让既有探针的字面断言继续成立），
       但只要改了它，这里的 --pad 必须同改 —— 收起态细条的盒宽盒高从它算。 */
    --pad: 4px;
  }

  /* ---------------- 皮肤令牌 ----------------
     只声明"这一套皮肤长什么样"的变量，选择器挂在 body[data-skin] 上，
     默认 light（灰白纱）—— 用户没去设置里点过时就用它。 */
  body[data-skin="light"] {
    /* 灰白玻璃：抛弃深色底。α 与深纱统一到 .82 —— 两套皮肤同一通透度，
       换皮肤时不会一档"更实"一档"更透"；.82 也是实测稳档（深字最坏 8.9:1）。 */
    --pill-bg: rgba(243,244,248,.82);
    --pill-border: rgba(120,128,145,.38);
    --sheen: rgba(255,255,255,.95);       /* 顶部高光：读作"玻璃"的那一笔 */
    --pill-shadow: 0 6px 18px rgba(10,14,30,.20);
    --fg: #262a33;                        /* 深字：浅底上最差 ≈ 9.9:1（AA） */
    --fg-soft: rgba(38,42,51,.72);
    --btn-bg: rgba(20,24,40,.07);
    --btn-bg-hover: rgba(20,24,40,.13);
    --btn-fg: #262a33;
    --rec: #C73E3A;                       /* 浅玻璃上 2.98:1 的 #D8443F 不过非文字 3:1 线，换深一档 */
    --ok: #1f7a52;
    --ok-bg: rgba(31,122,82,.12);
    --danger: #C73E3A;
    --danger-bg: rgba(199,62,58,.12);
  }
  body[data-skin="dark"] {
    --pill-bg: rgba(10,12,18,.82);        /* 深纱：实时字幕窗同款配方 */
    --pill-border: rgba(158,203,255,.28);
    --sheen: rgba(255,255,255,.10);
    --pill-shadow: 0 8px 22px rgba(0,0,0,.45);
    --fg: #ffffff;                        /* 白字：深纱上最差 ≈ 11.7:1（AA） */
    --fg-soft: rgba(255,255,255,.78);
    --btn-bg: rgba(255,255,255,.10);
    --btn-bg-hover: rgba(255,255,255,.18);
    --btn-fg: #ffffff;
    --rec: #D8443F;
    --ok: #4fc98d;
    --ok-bg: rgba(79,201,141,.16);
    --danger: #e8736a;
    --danger-bg: rgba(216,68,79,.18);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    /* 透明窗：圆角与纱底由 .skin 画，窗外那 4px 留给阴影呼吸 */
    background: transparent;
    color: var(--fg);
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    overflow: hidden;
    /* 控制条本身就是个小挂件，禁掉选中/拖拽默认行为，观感更接近原生 */
    user-select: none; -webkit-user-select: none;
    cursor: default;
  }

  /* ---------------- 三层结构 ----------------
     .skin  形状层：纱底 + 描边 + 高光 + 投影（能量条只缩它）
     .full  完整层：红点 + 计时 + 三钮（收起时淡出）
     .mini  能量条层：细点 + 小计时（收起时淡入）
     分层而不是缩放整条：scale 会把秒数文字一起压扁，分层让两层各自
     只用 transform / opacity 过渡，符合"动效只动 transform/opacity"的铁律。 */
  .bar {
    position: relative; width: 100%; height: 100%;
    /* ⚠️ 2026-10-23 修「点按钮变成拖窗口」：原来整条 .bar 都是 drag 区，
       只要按下的位置偏出按钮（能量条收起过、或 `.full` 的 transform 让
       Chromium 的拖拽区命中测试算出偏移），Windows 就把这一下当"拖窗"，
       click 永远不会进页面 —— 日志里表现为窗口被拖动 N 帧、却没有任何
       "点击 btnXXX"。现在拖拽区收窄到左侧计时块（.left），其余区域不拖窗：
       按偏了最多没反应，不会再吃掉按钮的点击。 */
  }
  .skin {
    position: absolute; inset: 4px;
    background: var(--pill-bg);
    /* 玻璃化：窗口本来就是 transparent（主进程 transparent:true + #00000000），
       pill 底衫早就是半透明"纱" —— 只差这一行模糊才读作玻璃。
       静态 blur(8px)（与面板浮层同一档），不做动画、不缩放，符合既有性能红线。
       录制时它压在正在录的画面上，背景比静态壁纸还花，模糊的收益比面板更大。 */
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    /* --uc = 用户自选描边色（设置 › 录屏 › 描边颜色）；没选就用皮肤默认描边 */
    border: 1px solid var(--uc, var(--pill-border));
    border-radius: 12px;
    /* 内圈那道细线是"反差保险"：自选色过浅（灰白纱上）或过深（深纱上）时，
       由 JS 按亮度补一圈对色调 Hairline，描边在任何皮肤上都看得见。
       没自选时 --uc-hair 未定义 → 落 transparent，不改变默认观感。 */
    box-shadow: inset 0 1px 0 var(--sheen), inset 0 0 0 1px var(--uc-hair, transparent), var(--pill-shadow);
    /* 收起时朝**顶边**收（默认 50% 50% 会让细条缩到窗口垂直中间，
       看着像悬在屏幕中央）。贴着窗口顶边收，细条才一直压在屏幕上沿。 */
    transform-origin: 50% 0;
    /* 换皮肤时底色/描边跟着过渡，不"啪"一下（模糊本身不做动画：
       软件渲染下对 backdrop-filter 做动画必卡，这是既有红线） */
    transition: transform var(--dur-2) var(--ease),
                background var(--dur-2) var(--ease),
                border-color var(--dur-2) var(--ease);
  }
  .full {
    position: absolute; inset: 4px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px 0 14px;
    transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
  }
  .mini {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--fg); pointer-events: none;
    opacity: 0; transform: scale(.9);
    transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
  }

  /* 能量条态：skin 缩成细条，full 淡出，mini 淡入 */
  .bar.energy .skin { transform: scale(var(--shrink-x), var(--shrink-y)); }
  /* 能量条态：把 .mini 的盒子算成"缩放之后的纱层"
     ------------------------------------------------------------------
     症状（真机自拍 docs/_recbar_glass_energy.png 实锤）：.mini 是 inset:0 的
     整窗 flex 居中层，自己不缩放，于是文字停在窗口垂直中心 y≈27；而 .skin 已
     scale(.78,.34) 贴顶收成细条（top=4、高仅 15.64），红点+计时就漂到条外去了。

     解法：不改字号、不缩放内容，只把 .mini 的**盒子**摆成纱层变换后的那块：
       top    = 4（纱层自身 top，transform-origin 50% 0 → 缩放不改变上边）
       宽     = (100% - 8px) * --shrink-x
       高     = (100% - 8px) * --shrink-y
       左     = (100% - 宽度) / 2   ← 纱层是左右居中缩的，等价于
                4 + (100% - 8px) * (1 - --shrink-x) / 2（两式恒等，见探针断言）
     全部用 calc 从变量算，不写死像素：改缩放比只动 --shrink-x/--shrink-y，
     盒子自动跟着走。盒内 flex 仍是居中，所以细条上文字居中、读得清。 */
  .bar.energy .mini {
    top: var(--pad);
    left: calc((100% - (100% - var(--pad) * 2) * var(--shrink-x)) / 2);
    width: calc((100% - var(--pad) * 2) * var(--shrink-x));
    height: calc((100% - var(--pad) * 2) * var(--shrink-y));
    right: auto; bottom: auto;
  }
  /* 桌面模糊底图：.skin 的 backdrop-filter 在透明窗里采不到桌面（身后只有透明，
     见 docs/_glass_rt_probe.js 实测），所以由主进程抓一张桌面实拍垫在
     .skin 背后（本窗口已 setContentProtection 排除出截图 → 抓图不含自己 →
     不藏窗、不闪、拖动也无错位），.skin 的 blur(8px) 负责糊成磨砂。
     ⚠️ inset 必须与 .skin 一致（4px）：
       ① 盒不同 → 底图比纱大一圈，纱的圆角外会露出"多出来的底图"，读作黑边；
       ② transform-origin 是按**自身盒**算的，盒不同 → 能量条收起时两层缩放
          起点不重合，细条里会错位一条缝。同盒 + 同 50% 0 才严格同步。
     背景尺寸/偏移由 JS 按整屏图与窗口位移算（paintGlass）；energy 收起时
     跟着 .skin 一起缩。 */
  #glassbg {
    position: absolute; inset: 4px; z-index: 0;
    background-repeat: no-repeat;
    border-radius: 12px;
    /* transform-origin 必须常驻在基础规则里（与 .skin 同为 50% 0）：
       只写在 .bar.energy 里的话，非收起态算出来是 50% 50%，两层就不"同源"了 ——
       探针 docs/_recbar_glass_probe.js 一开始正是这样抓到 375px 209px / 375px 0px。 */
    transform-origin: 50% 0;
    opacity: 0;
    /* transform 与 .skin 用**同一条**过渡曲线：收起/展开的 220ms 里两层若一个
       瞬间跳、一个慢慢缩，中途就会错开（纱还大着、底图已经细了），读作闪。
       动的是 transform 不是 backdrop-filter —— 不碰既有性能红线。 */
    transition: opacity var(--dur-2) var(--ease),
                transform var(--dur-2) var(--ease);
    pointer-events: none;
  }
  #glassbg.on { opacity: 1; }
  /* 收起：与 .skin 用同一个缩放比 —— 两层同盒同源，细条才严丝合缝（不出黑边/错位） */
  .bar.energy #glassbg { transform: scale(var(--shrink-x), var(--shrink-y)); }
  /* 收起态只淡出、**不缩放**：`.full` 上有 transform 时，Chromium 的
     -webkit-app-region 命中测试会按未变换的几何算，导致按钮的 no-drag 区
     错位、按下被当成拖窗（2026-10-23 实测：点按钮却拖动窗口 52/136 帧）。
     缩放本来只是观感，去掉不影响任何状态语义。 */
  .bar.energy .full { opacity: 0; pointer-events: none; }
  .bar.energy .mini { opacity: 1; transform: none; }

  /* ---------------- 左侧：红点 + 计时 ---------------- */
  /* 拖拽手柄：只有左侧计时块能拖窗（见 .bar 上的说明）。
     no-drag 留给按钮，语义不变。 */
  .left { display: flex; align-items: center; gap: 8px; -webkit-app-region: drag; }
  .dot, .mdot {
    border-radius: 50%; background: var(--rec); flex: none;
    /* 录制中：呼吸式闪烁。只动 opacity，不碰 transform —— 红点位置固定，
       任何位移在小直径上都会被看出抖动。 */
    animation: dotBlink 1s steps(1, end) infinite;
  }
  .dot { width: 10px; height: 10px; }
  .mdot { width: 6px; height: 6px; }
  /* 暂停：停闪并压暗 —— 用户要一眼看出"现在没在录" */
  .bar.paused .dot, .bar.paused .mdot { animation-play-state: paused; opacity: .35; }
  @keyframes dotBlink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: .35; } }

  .time, .mtime {
    font-weight: 600; letter-spacing: .3px; color: var(--fg);
    /* 等宽数字：秒数跳动时宽度不能变，否则条子会跟着呼吸 */
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .time { font-size: 14px; min-width: 56px; }
  .mtime { font-size: 10.5px; min-width: 0; }

  /* ---------------- 右侧：三个图标钮 ---------------- */
  .btns { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; }
  .btn {
    width: 30px; height: 30px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; border-radius: 50%;
    background: var(--btn-bg); color: var(--btn-fg);
    cursor: pointer; padding: 0;
    -webkit-app-region: no-drag;
    transition: transform var(--dur-1) var(--ease), background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
  }
  .btn:hover { background: var(--btn-bg-hover); color: var(--fg); transform: translateY(-1px); }
  .btn:active { transform: scale(.94); }
  .btn:focus-visible { outline: 2px solid var(--pill-border); outline-offset: 1px; }
  .btn svg { width: 19px; height: 19px; display: block; }

  /* 完成 / 取消 的语义色：hover 才上色，平时保持中性，不抢红点的注意力 */
  #btnFinish:hover { color: var(--ok); background: var(--ok-bg); }
  #btnAbort:hover  { color: var(--danger); background: var(--danger-bg); }

  /* 暂停 / 继续是同一个按钮的两种形态。
     暂停图标 hover 时两条竖条向两侧各挪 1px —— 表达"再点一下就分开（继续）"。
     只做这一种变形，不叠加缩放/旋转，避免小图标上动效打架。 */
  .bar:not(.paused) #btnPP:hover .bar-l { transform: translateX(-1px); }
  .bar:not(.paused) #btnPP:hover .bar-r { transform: translateX(1px); }
  .ico-pause .bar-l, .ico-pause .bar-r { transition: transform var(--dur-1) var(--ease); }

  /* 入场：按钮逐个 40ms stagger 落位。
     fill-mode 只用 backwards：让"还没轮到"的按钮先停在起始态，
     但**不能用 both** —— both 会把 to 态（translateY(0)/opacity:1）
     在动画结束后继续钉住，万一哪天删了静态规则，元素就永远停在动画终态。 */
  .bar .btn { animation: btnIn var(--dur-3) var(--ease) backwards; }
  .bar .btns .btn:nth-child(1) { animation-delay: 0ms; }
  .bar .btns .btn:nth-child(2) { animation-delay: 40ms; }
  .bar .btns .btn:nth-child(3) { animation-delay: 80ms; }
  @keyframes btnIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------------- 双兜底：关动效 ----------------
     ① 系统设置「减少动态效果」；② 页面被加上 html.no-motion（与面板同一套约定）。
     两者都不能把红点闪烁一起干掉 —— 那是"正在录制"的唯一状态指示，
     没了它用户会以为没在录。能量条的收展也保留：那是状态切换不是装饰，
     关的只是过渡，收/展仍然瞬间生效。 */
  @media (prefers-reduced-motion: reduce) {
    .btn { animation: none; transition: none; }
    .btn:hover { transform: none; }
    .skin, .full, .mini, #glassbg { transition: none; }
    .bar:not(.paused) #btnPP:hover .bar-l,
    .bar:not(.paused) #btnPP:hover .bar-r { transform: none; }
  }
  html.no-motion .btn,
  html.no-motion .btn:hover,
  html.no-motion .skin, html.no-motion .full, html.no-motion .mini,
  html.no-motion #glassbg,
  html.no-motion .bar:not(.paused) #btnPP:hover .bar-l,
  html.no-motion .bar:not(.paused) #btnPP:hover .bar-r { animation: none; transform: none; transition: none; }
</style>
</head>
<body data-skin="light">
  <!-- 语义化 + aria：纯图标按钮必须给辅助设备一条活路 -->
  <div class="bar" id="bar">
    <!-- 桌面模糊底图：垫在 .skin 背后（DOM 在前 → 绘制在下），.skin 的 blur(8px) 糊它 -->
    <div id="glassbg" aria-hidden="true"></div>
    <div class="skin" aria-hidden="true"></div>
    <div class="full">
      <div class="left">
        <span class="dot" id="dot" aria-hidden="true"></span>
        <span class="time" id="time" aria-label="已录制时长">00:00</span>
      </div>
      <div class="btns">
        <!-- 暂停 / 继续（同一按钮两态） -->
        <button class="btn" id="btnPP" type="button" title="暂停" aria-label="暂停">
          <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect class="bar-l" x="7" y="5" width="3.6" height="14" rx="1.2"/>
            <rect class="bar-r" x="13.4" y="5" width="3.6" height="14" rx="1.2"/>
          </svg>
          <svg class="ico-resume" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
            <path d="M9 6.5 18 12 9 17.5Z"/>
          </svg>
        </button>
        <!-- 取消 -->
        <button class="btn" id="btnAbort" type="button" title="取消录制" aria-label="取消录制">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 7l10 10M17 7L7 17"/>
          </svg>
        </button>
        <!-- 完成 -->
        <button class="btn" id="btnFinish" type="button" title="完成录制" aria-label="完成录制">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5.5 12.5l4.2 4.2 8.8-9.4"/>
          </svg>
        </button>
      </div>
    </div>
    <!-- 能量条层：与 .full 同一份计时，避免两处各算一遍 -->
    <div class="mini" aria-hidden="true">
      <span class="mdot"></span><span class="mtime" id="mtime">00:00</span>
    </div>
  </div>

<script>
  /* ------------------------------------------------------------------
     状态机（严格以主进程回传的 rec:event 为准，本地不自作主张）
       start  → 清零 + 开始走时 + 排一个"自动收起"定时器
       pause  → 冻结 + 累计已录时长 + 切成「继续」三角（保持展开，别缩）
       resume → 续走 + 切回「暂停」竖条 + 重新排收起
       stop   → 停表 + 强制展开（窗口会被主进程隐藏）
     点按钮只负责发命令，UI 等事件回来再变 —— 否则主进程拒绝（比如
     面板已经没了）时，本地状态会和真实录制状态对不上。
     ------------------------------------------------------------------ */
  var bar = document.getElementById("bar");
  var timeEl = document.getElementById("time");
  var mtimeEl = document.getElementById("mtime");
  var btnPP = document.getElementById("btnPP");
  var icoPause = bar.querySelector(".ico-pause");
  var icoResume = bar.querySelector(".ico-resume");

  var elapsedMs = 0;      // 已录制毫秒（不含当前这一段）
  var segStartedAt = 0;   // 当前走时段的起点
  var running = false;
  var tickTimer = null;
  var TICK_MS = 250;      // 250ms：秒数显示不需要更细，少一次重排是一次

  /* ---------- 能量条：参数与状态 ---------- */
  var COLLAPSE_AFTER = 2600;   // 开始/继续录制后多久收成细条
  var LEAVE_AFTER = 700;       // 鼠标移开后多久收回
  /* 细条的可悬停判定区（窗口 240×54 内）。收起后细条贴着窗口顶边
     （transform-origin: 50% 0），所以 y0 从 0 起、往下留到 34 —— 比细条本身
     宽一圈，手指/鼠标不必正正好好对准。必须与 main.js 的 REC_HIT 一致。 */
  var HIT = { x0: 16, x1: 224, y0: 0, y1: 34 };
  /* 与主进程的 REC_HOVER_PAD 对齐：那条路（轮询光标）判定区是外扩 8px 的，
     这里（页面自己的 mousemove 快路径）不外扩的话，两条路对"算不算悬停"的
     答案就不一样 —— 同一个鼠标位置，一条判进、一条判不进。 */
  var HIT_PAD = 8;
  var energyOn = true;         // 设置 › 录屏 里可关；关了就永远是完整条
  var paused = false;
  var collapseTimer = null;
  var leaveTimer = null;

  function fmt(ms) {
    var total = Math.max(0, Math.floor(ms / 1000));
    var m = Math.floor(total / 60);
    var s = total % 60;
    return (m < 10 ? "0" + m : "" + m) + ":" + (s < 10 ? "0" + s : "" + s);
  }
  function paint() {
    var cur = elapsedMs + (running ? (Date.now() - segStartedAt) : 0);
    var text = fmt(cur);
    timeEl.textContent = text;
    mtimeEl.textContent = text;
  }
  function startTicker() {
    stopTicker();
    tickTimer = setInterval(paint, TICK_MS);
  }
  function stopTicker() {
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  }
  /* 走时/暂停的视觉切换：暂停时给 bar 加 paused（停闪 + 切图标）。 */
  function setPaused(p) {
    bar.classList.toggle("paused", !!p);
    var showResume = !!p;
    icoPause.style.display = showResume ? "none" : "";
    icoResume.style.display = showResume ? "" : "none";
    btnPP.title = showResume ? "继续" : "暂停";
    btnPP.setAttribute("aria-label", showResume ? "继续" : "暂停");
  }

  /* ---------- 能量条：收 / 展 ----------
     收起时经主进程把窗口切成"点击穿透"：细条只被看见，不会挡住背后的
     最大化按钮 / 浏览器标签页。穿透开着的窗口仍能收到 mousemove
     （forward:true 的语义），所以悬停判定靠 pointermove 的坐标。 */
  function setThrough(on) {
    if (window.orb && typeof window.orb.setClickThrough === "function") {
      try { window.orb.setClickThrough(!!on); } catch { /* 桥没起来就不穿透，功能不瞎 */ }
    }
  }
  function clearEnergyTimers() {
    if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
    if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; }
  }
  function collapse() {
    if (!energyOn || !running || paused) return;
    if (bar.classList.contains("energy")) return;
    bar.classList.add("energy");
    setThrough(true);
    /* 诊断日志（只在真的收起时打一次，不是每帧）：与主进程的「穿透 ON」配对看，
       能一眼分清"页面没收起/主进程没收到穿透申报"是哪一环断了。 */
    console.log("[recbar] 收起成能量条");
  }
  function scheduleCollapse() {
    if (collapseTimer) clearTimeout(collapseTimer);
    if (!energyOn || !running || paused) return;
    collapseTimer = setTimeout(collapse, COLLAPSE_AFTER);
  }
  function expand() {
    clearEnergyTimers();
    if (bar.classList.contains("energy")) {
      bar.classList.remove("energy");
      setThrough(false);          // 先收回了事件，再收起穿透，否则这一下点击会漏下去
      /* 诊断日志：只有真的从收起态展开时才打。与主进程的「悬停 进入」配对看 ——
         有「悬停 进入」没有这一行 = IPC 到了但页面没展开；两行都没有 = 悬停没被判定到。 */
      console.log("[recbar] 展开（悬停触发）+ 关闭穿透");
    }
  }

  /* 主通道：主进程盯着光标，进/出各广播一次 —— Windows 下穿透窗口根本收不到
     鼠标事件，页面自己判是判不出来的（详见 main.js 的 rec-bar-passthru）。
     ⚠️ 这条通路在**展开态也必须活着**：展开靠 inside:true，而"该收回去了"完全
     依赖主进程把 inside:false 送回来（页面自己的 mouseleave 在穿透刚关那一下
     常常不补发）。主进程那边已改成穿透 OFF 也不停监视，这里保持原样即可。 */
  if (typeof window.orb.onRecHover === "function") {
    window.orb.onRecHover(function (p) {
      if (!p) return;
      if (p.inside) {
        /* 鼠标在条上：取消一切待收（含上一次移开排的 leaveTimer）。 */
        expand();
      } else {
        /* 鼠标移开：排 700ms 后收回。这条日志是"移开后能不能收"的唯一证据 ——
           报"再也不缩起"时，若 orb.log 里没有这一行，就是主进程没把移开送过来。 */
        console.log("[recbar] 悬停离开，排 700ms 后收起");
        scheduleLeave();
      }
    });
  }
  /* 快路径：macOS 上 forward:true 的 mousemove 转发是可靠的，能省掉一次 IPC 往返。
     两条路都调 expand()，谁先到算谁的，expand() 本身幂等。 */
  window.addEventListener("mousemove", function (e) {
    if (!bar.classList.contains("energy")) return;
    if (e.clientX >= HIT.x0 - HIT_PAD && e.clientX <= HIT.x1 + HIT_PAD
        && e.clientY >= HIT.y0 - HIT_PAD && e.clientY <= HIT.y1 + HIT_PAD) expand();
  });
  /* 键盘 Tab 到按钮上也要展开，否则焦点落在看不见的按钮上 */
  window.addEventListener("focusin", expand);
  /* 移开 700ms 后收回；只在"真的在录、没暂停"时收 */
  function scheduleLeave() {
    if (leaveTimer) clearTimeout(leaveTimer);
    if (!energyOn || !running || paused) return;
    leaveTimer = setTimeout(collapse, LEAVE_AFTER);
  }
  bar.addEventListener("mouseleave", scheduleLeave);
  bar.addEventListener("mouseenter", function () {
    if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; }
  });

  /* ---------- 主进程配置（皮肤 / 能量条开关 / 自选描边色） ---------- */
  /* 自选描边色：直接当 1px 边线用。过浅/过深的颜色配一道反差细线
     （inset hairline），否则白边在灰白纱上、黑边在深纱上会整条看不见。 */
  function applyBorder(hex) {
    var m = /^#([0-9a-fA-F]{6})$/.exec(String(hex || "").trim());
    if (!m) {
      bar.style.removeProperty("--uc");
      bar.style.removeProperty("--uc-hair");
      return;
    }
    var n = parseInt(m[1], 16);
    var lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
    bar.style.setProperty("--uc", hex);
    bar.style.setProperty("--uc-hair", lum > 0.62 ? "rgba(0,0,0,.42)" : "rgba(255,255,255,.42)");
  }

  function applyCfg(p) {
    if (!p) return;
    if (p.skin === "dark" || p.skin === "light") document.body.setAttribute("data-skin", p.skin);
    if (typeof p.energy === "boolean") {
      energyOn = p.energy;
      if (!energyOn) expand();     // 用户关掉了自动收起：立刻回到完整条
    }
    if (typeof p.borderColor === "string") applyBorder(p.borderColor);
    scheduleCollapse();            // 设置可能在录制中途被改（面板隐藏前改的），重排一次
  }

  function onEvent(payload) {
    var t = payload && payload.type;
    if (t === "start") {
      elapsedMs = 0; segStartedAt = Date.now(); running = true; paused = false;
      setPaused(false);
      paint();
      startTicker();
      expand();                    // 新的一段从完整条开始，给用户看清有哪些键
      scheduleCollapse();
    } else if (t === "pause") {
      // 先把这一段结算进 elapsedMs，再停表：顺序反了会丢掉 pause 前那半秒
      elapsedMs += Date.now() - segStartedAt;
      running = false; paused = true;
      stopTicker();
      paint();
      setPaused(true);
      expand();                    // 暂停态保持展开：用户大概率要点"继续"
      if (collapseTimer) { clearTimeout(collapseTimer); collapseTimer = null; }
    } else if (t === "resume") {
      if (running) return;                 // 已经在跑了就别重置起点
      segStartedAt = Date.now(); running = true; paused = false;
      setPaused(false);
      startTicker();
      scheduleCollapse();
    } else if (t === "stop") {
      running = false; paused = false;
      stopTicker();
      setPaused(false);
      expand();                    // 终值保留一瞬（主进程紧接着会隐藏窗口），下次 start 再清零
      clearEnergyTimers();
      paint();
    }
  }

  function cmd(c) {
    if (window.orb && typeof window.orb.sendBarCmd === "function") window.orb.sendBarCmd(c);
  }
  /* 三个按钮各自显式打一行点击日志（不用事件代理：代理只会告诉你"冒泡到了容器"，
     分不清到底哪个按钮、以及是不是根本没到页面）。这三行 + 主进程的
     「收到命令 / 已转发命令」两行，就能把"点了没反应"定位到具体环：
       无「点击」                    → 点击没进页面（穿透挂着 / 窗口被盖 / 坐标不在按钮上）
       有「点击」无「收到命令」      → preload 桥没起来或 IPC 被拦
       有「收到命令」无「已转发」    → 面板不存在 / 命令名不认识 */
  /* 诊断：记录任何进到页面的指针按下（捕获阶段，先于按钮的 click）。
     与下面的「点击 btnXXX」对照，能再细分一层：
       有 pointerdown、无 点击  → 按到了拖拽区/别的元素，或 click 被吃掉
       连 pointerdown 都没有    → 窗口根本没收到输入（穿透还挂着 / 被别的窗口盖住） */
  /* 默认关闭：拖动窗口时 pointerdown 会连着触发，加上主进程那条
     console-message 转发，一次拖拽就能在 orb.log 里刷一屏。要排查"点击没反应"
     时把 DIAG 改成 true（收展/离开/按钮那几行不受影响，它们本来就是低频的）。 */
  var DIAG = false;
  document.addEventListener("pointerdown", function (e) {
    if (!DIAG) return;
    var t = e.target || {};
    console.log("[recbar] pointerdown @" + Math.round(e.clientX) + "," + Math.round(e.clientY)
      + " target=" + (t.id || t.className || t.tagName || "?"));
  }, true);

  btnPP.addEventListener("click", function () {
    console.log("[recbar] 点击 btnPP");
    cmd(running ? "pause" : "resume");
  });
  document.getElementById("btnAbort").addEventListener("click", function () {
    console.log("[recbar] 点击 btnAbort");
    cmd("abort");
  });
  document.getElementById("btnFinish").addEventListener("click", function () {
    console.log("[recbar] 点击 btnFinish");
    cmd("finish");
  });

  /* 键盘兜底：按钮本来就 focusable，回车/空格浏览器自己会触发 click，
     这里只补 Esc = 取消，符合主流录屏软件的手感。 */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") cmd("abort");
  });

  /* ---------- 桌面模糊底图（整屏图 + 位移平移） ----------
     主进程（glassbg.js 的 full 模式）给的是**整屏**图 + disp（显示器 DIP 矩形），
     不是裁好的窗口块 —— 一张整屏图对桌面静止时窗口的任意位置都成立，于是拖动
     全程只来位移帧 {kind:"pos",x,y}（16ms 节流），这里改 background-position 平移
     即可：零重截、跟手、松手不再闪那一下。
     glassShot = 最近一张整屏图载荷（含 disp / at）；glassPos = 最近一帧窗口 DIP 位置。 */
  var glassShot = null;
  var glassPos = null;

  /* 只动 background-size / background-position，不碰图片本身（拖动每帧都要跑，
     重建 data URL 会反复解码，必卡）。 */
  function paintGlass() {
    var el = document.getElementById("glassbg");
    if (!el || !glassShot) return;
    /* 老 crop 载荷（只有 png、没有 disp）：拉伸铺满兜底，别把底图弄没了。
       改动后录制条不会再收到这种载荷（main.js 已切 full），纯兼容老版本主进程。 */
    if (!glassShot.disp) {
      if (glassShot.png) {
        el.style.backgroundImage = "url(data:image/png;base64," + glassShot.png + ")";
        el.style.backgroundSize = "100% 100%";
        el.style.backgroundPosition = "0 0";
      }
      return;
    }
    var d = glassShot.disp;
    var p = glassPos || glassShot.at;
    if (!p) return;                       // 新图既没 at 也没历史位置：保持上一帧
    /* 元素比窗口内缩 4px（inset:4px），所以「元素左上角在桌面上的 DIP 坐标」
       = 窗口位置 + 元素在窗口内的偏移。必须用 offsetLeft/Top：
       它们不受 transform 影响，能量条收起（scale .78/.34）时读到的仍是 4；
       换成 getBoundingClientRect 会被缩放算成 3.12，底图整条错开。 */
    el.style.backgroundSize = d.w + "px " + d.h + "px";
    el.style.backgroundPosition =
      -(p.x + el.offsetLeft - d.x) + "px " + -(p.y + el.offsetTop - d.y) + "px";
  }

  /* 收主进程回传：位移帧走高频路径（只重画位置），其余（换屏 / 隐藏态补新鲜度
     / 手动刷新）是新图，先换 image 再按抓取时的窗口位置对齐一帧。 */
  function onGlassBg(shot) {
    if (!shot) return;
    var el = document.getElementById("glassbg");
    if (!el) return;
    if (shot.kind === "pos" ||
        (typeof shot.x === "number" && typeof shot.y === "number" && !shot.img && !shot.png)) {
      glassPos = { x: shot.x, y: shot.y };
      paintGlass();
      return;
    }
    var data = shot.img || shot.png;
    if (data) el.style.backgroundImage = "url(data:" + (shot.mime || "image/png") + ";base64," + data + ")";
    glassShot = shot;
    glassPos = shot.at || glassPos;
    paintGlass();
    el.classList.add("on");
  }

  /* preload 注入的桥：先订阅再允许主进程发事件。
     订阅放在 DOMContentLoaded 之前也没关系（preload 比页面脚本更早跑），
     但统一在末尾显式做一次，读起来更清楚。 */
  if (window.orb) {
    if (typeof window.orb.onRecEvent === "function") window.orb.onRecEvent(onEvent);
    if (typeof window.orb.onRecCfg === "function") window.orb.onRecCfg(applyCfg);
    /* 桌面模糊底图：常申报（控制条常驻可见）。整屏图 + 位移帧都从这个通道来。 */
    if (typeof window.orb.onGlassBg === "function") window.orb.onGlassBg(onGlassBg);
    if (typeof window.orb.glassBgWant === "function") window.orb.glassBgWant(true);
  }
  paint();
</script>
</body>
</html>
