<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    user-select: none; cursor: grab;
  }
  body:active { cursor: grabbing; }
  .ball {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .ball img {
    width: 66px; height: 66px; display: block;
    /* 投影改中性黑：以前是紫罗兰色调（rgba(38,33,92,.35)），
       自选交互色是青柠/琥珀时这一坨永远是脏紫 */
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.28));
    transition: transform .18s ease;
    -webkit-user-drag: none;
  }
  body.hot .ball img { transform: scale(1.06); }

  body.docked { cursor: pointer; }
  body.docked .ball img { display: none; }
  body.docked .ball { background: linear-gradient(160deg, #b4b2a9, #5f5e5a); }
  body.dock-left .ball { border-radius: 0 8px 8px 0; }
  body.dock-right .ball { border-radius: 8px 0 0 8px; }

  /* 思考动效：交互色光晕自图标向外同步扩大/缩小（呼吸感）。
     颜色跟随主题交互色（--accent 由主进程随主题推送，见 main.js pushThemeVars）：
     以前写死品牌蓝，自选青柠/琥珀时这一圈与主题无关。 */
  .halo {
    display: none; position: absolute; inset: 5px; z-index: 0;
    border-radius: 50%;
    /* 径向光晕，边缘完全透明，缩放时不会看到硬边 */
    background: radial-gradient(circle at 50% 50%,
                color-mix(in srgb, var(--accent, #5b6ee8) 52%, transparent) 0%,
                color-mix(in srgb, var(--accent, #5b6ee8) 30%, transparent) 44%,
                color-mix(in srgb, var(--accent, #5b6ee8) 12%, transparent) 66%,
                color-mix(in srgb, var(--accent, #5b6ee8) 0%, transparent) 78%);
    will-change: transform, opacity;
  }
  /* 第二层：一圈细环，跟光晕同节奏，让"扩大"更明确 */
  .halo::after {
    content: ''; position: absolute; inset: 7px; border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--accent, #5b6ee8) 68%, transparent);
    opacity: .9;
  }
  /* logo 压在光晕之上 */
  .ball { position: relative; z-index: 1; }

  body.busy .halo { display: block; animation: breathe 1.7s cubic-bezier(.45,0,.55,1) infinite; }
  body.busy .ball img { animation: bob 1.7s cubic-bezier(.45,0,.55,1) infinite; }
  /* 双兜底必须**紧贴**基类（等特异性 + 基类在后会盖成死代码）。这两条是无限
     循环的常驻动画：系统开了"减少动态效果"或面板关了动效（html.no-motion 由
     主进程推）时不停，这个窗口就等于不认用户的动效偏好。 */
  html.no-motion body.busy .halo,
  html.no-motion body.busy .ball img { animation: none; }
  @media (prefers-reduced-motion: reduce) {
    body.busy .halo,
    body.busy .ball img { animation: none; }
  }

  /* 同一组 transform 同时驱动光晕与蓝环 → 视觉上"同步扩大/缩小" */
  @keyframes breathe {
    0%, 100% { transform: scale(.86); opacity: .45; }
    50%      { transform: scale(1.14); opacity: 1; }
  }
  @keyframes bob {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
</style>
</head>
<body>
  <div class="ball"><img id="icon" src="icon.png" alt="Orb"></div>
  <div class="halo"></div>

<script>
  const body = document.body;
  const icon = document.getElementById('icon');

  function syncDocked(side) {
    const docked = window.innerWidth < 40;
    body.classList.toggle('docked', docked);
    body.classList.remove('dock-left', 'dock-right');
    if (docked) body.classList.add('dock-' + (side || (window.screenX < 40 ? 'left' : 'right')));
  }
  syncDocked();
  window.addEventListener('resize', () => syncDocked());
  window.orb.onDockState((side) => setTimeout(() => syncDocked(side), 40));

  body.addEventListener('mouseenter', () => {
    body.classList.add('hot');
    window.orb.hover(true);
    if (window.innerWidth < 40) window.orb.undock();
  });
  body.addEventListener('mouseleave', () => {
    body.classList.remove('hot');
    window.orb.hover(false);
  });

  let downAt = null;
  window.addEventListener('mousedown', (e) => {
    if (e.button === 2) return;
    downAt = { x: e.screenX, y: e.screenY };
    window.orb.dragBegin();
  });
  window.addEventListener('mouseup', (e) => {
    if (e.button === 2) return;
    if (!downAt) return;
    downAt = null;
    window.orb.dragEnd();
  });
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.orb.contextMenu();
  });

  window.orb.onBusy((v) => body.classList.toggle('busy', !!v));
  window.orb.onPanelState((open) => body.classList.toggle('active', !!open));
  window.orb.onAvatar((url) => { if (url) icon.src = url; });

  window.orb.getState().then((s) => { if (s && s.avatar) icon.src = s.avatar; });
</script>
</body>
</html>
