<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    user-select: none;
  }
  /* 主题令牌：浅色（t2 / t3 / t4 回退）写在 :root，深空 t1 单独覆盖。
     主进程会按当前主题给 <html> 打 data-theme（与面板同源）；没收到时退回浅色，不会黑块。 */
  :root {
    --bg:#ffffff; --bg-soft:#faf9f6; --bg-sunken:#f4f3ef;
    --fg:#2c2c2a; --fg-soft:#5f5e5a; --fg-muted:#928f86;
    --border:#eceae3; --border-strong:#d9d6cc;
    --accent:#534ab7; --accent-soft:#eeedfe; --accent-fg:#3c3489;
    --sh-lg:0 3px 14px rgba(38,33,92,.20);
  }
  [data-theme="t1"] {
    --bg:#12162b; --bg-soft:#171c35; --bg-sunken:#0e1224;
    --fg:#e8eaf6; --fg-soft:#b9bfe0; --fg-muted:#7c85ad;
    --border:#262c4d; --border-strong:#39406b;
    --accent:#5b6ee8; --accent-soft:#1e2547; --accent-fg:#a8b6ff;
    --sh-lg:0 3px 14px rgba(0,0,0,.45);
  }
  .bar {
    height: 40px; margin: 2px; display: flex; align-items: stretch;
    background: var(--bg-soft); border: 0.5px solid var(--border-strong); border-radius: 10px;
    box-shadow: var(--sh-lg); overflow: hidden;
  }
  button {
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; color: var(--fg);
    border-right: 0.5px solid var(--border); white-space: nowrap;
  }
  button:last-child { border-right: none; }
  button:hover { background: var(--accent-soft); color: var(--accent-fg); }
  button:disabled { opacity: .55; cursor: default; }

  /* ---------- 翻译结果卡 ----------
     点「翻译」后工具条就地变成这张卡：译文 + 复制 + 关闭。
     ⚠️ 不再把文字塞进对话框 —— 那正是"翻译只是把选中的文字添加进控制台
        对话框"的老毛病。单独开一个窗口又太重：划词是"看一眼就走"的动作。 */
  .card {
    margin: 2px; height: calc(100% - 4px); box-sizing: border-box;
    display: flex; flex-direction: column;
    background: var(--bg-soft); border: 0.5px solid var(--border-strong); border-radius: 10px;
    box-shadow: var(--sh-lg); overflow: hidden;
  }
  .card-head {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 6px 5px 10px; border-bottom: 0.5px solid var(--border);
    font-size: 11.5px; color: var(--fg-muted); flex: 0 0 auto;
  }
  .card-head span { flex: 1; }
  .card-head button {
    flex: 0 0 auto; width: 22px; height: 22px; padding: 0; border: none; border-radius: 6px;
    font-size: 13px; line-height: 1; color: var(--fg-soft);
  }
  .card-body {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    padding: 8px 10px; font-size: 13px; line-height: 1.55; color: var(--fg);
    user-select: text; -webkit-user-select: text; white-space: pre-wrap; word-break: break-word;
  }
  .card-foot {
    flex: 0 0 auto; display: flex; gap: 6px; padding: 6px;
    border-top: 0.5px solid var(--border);
  }
  .card-foot button { border-radius: 7px; padding: 5px 0; }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <button id="search">搜索</button>
    <button id="translate">翻译</button>
    <button id="send">发给 Agent</button>
  </div>

  <div class="card" id="card" hidden>
    <div class="card-head"><span id="cardDir">译文</span><button id="cardClose" title="关闭">✕</button></div>
    <div class="card-body" id="cardText"></div>
    <div class="card-foot"><button id="cardCopy">复制译文</button></div>
  </div>

<script>
  let text = "";
  let busy = false;
  const bar = document.getElementById('bar');
  const card = document.getElementById('card');
  const cardText = document.getElementById('cardText');
  const cardDir = document.getElementById('cardDir');

  window.orb.onSelectionText((t) => { text = t || ""; showBar(); });

  /** 回到三键状态（换了一段选中文字时）。 */
  function showBar() {
    card.hidden = true;
    bar.hidden = false;
    window.orb.toolbarResize(216, 44);
  }

  function showCard(txt, dir, failed) {
    bar.hidden = true;
    card.hidden = false;
    cardDir.textContent = dir ? ('译文 · ' + dir) : (failed ? '翻译失败' : '提示');
    cardText.textContent = txt;
    window.orb.toolbarResize(340, 190);
  }

  async function doTranslate() {
    if (busy) return;
    if (!text.trim()) { showCard('没有选中文字。', '', true); return; }
    busy = true;
    const btn = document.getElementById('translate');
    btn.disabled = true;
    const old = btn.textContent;
    btn.textContent = '翻译中…';
    let r = null;
    try { r = await window.orb.toolbarTranslate(text); }
    catch (e) { r = { ok: false, error: String((e && e.message) || e) }; }
    busy = false;
    btn.disabled = false;
    btn.textContent = old;
    if (!r || !r.ok) showCard('翻译失败：' + ((r && r.error) || '未知错误'), '', true);
    else showCard(String(r.text || '（模型没给出译文）'), String(r.dir || ''), false);
  }

  document.getElementById('search').addEventListener('click', () => window.orb.toolbarAction('search', text));
  document.getElementById('translate').addEventListener('click', doTranslate);
  document.getElementById('send').addEventListener('click', () => window.orb.toolbarAction('send', text));
  document.getElementById('cardClose').addEventListener('click', () => window.orb.toolbarHide());
  document.getElementById('cardCopy').addEventListener('click', async () => {
    const b = document.getElementById('cardCopy');
    try {
      await window.orb.writeClipboard(cardText.textContent || '');
      b.textContent = '已复制 ✓';
    } catch { b.textContent = '复制失败'; }
    setTimeout(() => { b.textContent = '复制译文'; }, 1200);
  });

  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.orb.toolbarHide(); });
  document.addEventListener('mouseleave', () => window.orb.toolbarHide());
</script>
</body>
</html>
