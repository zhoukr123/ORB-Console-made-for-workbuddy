<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    user-select: none;
  }
  /* 主题令牌：浅色（t2 / t3 / t4 回退）写在 :root，深空 t1 单独覆盖。
     主进程会按当前主题给 <html> 打 data-theme（与面板同源）；没收到时退回浅色，不会黑块。 */
  :root {
    --bg:#ffffff; --bg-soft:#faf9f6; --bg-sunken:#f4f3ef;
    --fg:#2c2c2a; --fg-soft:#5f5e5a; --fg-muted:#928f86;
    --border:#eceae3; --border-strong:#d9d6cc;
    --accent:#534ab7; --accent-soft:#eeedfe; --accent-fg:#3c3489;
    --sh-lg:0 3px 14px rgba(38,33,92,.20);
  }
  [data-theme="t1"] {
    --bg:#12162b; --bg-soft:#171c35; --bg-sunken:#0e1224;
    --fg:#e8eaf6; --fg-soft:#b9bfe0; --fg-muted:#7c85ad;
    --border:#262c4d; --border-strong:#39406b;
    --accent:#5b6ee8; --accent-soft:#1e2547; --accent-fg:#a8b6ff;
    --sh-lg:0 3px 14px rgba(0,0,0,.45);
  }
  .bar {
    height: 40px; margin: 2px; display: flex; align-items: stretch;
    background: var(--bg-soft); border: 0.5px solid var(--border-strong); border-radius: 10px;
    box-shadow: var(--sh-lg); overflow: hidden;
  }
  button {
    flex: 1; border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 12.5px; color: var(--fg);
    border-right: 0.5px solid var(--border); white-space: nowrap;
  }
  button:last-child { border-right: none; }
  button:hover { background: var(--accent-soft); color: var(--accent-fg); }
</style>
</head>
<body>
  <div class="bar">
    <button id="search">搜索</button>
    <button id="translate">翻译</button>
    <button id="send">发给 Agent</button>
  </div>
<script>
  let text = "";
  window.orb.onSelectionText((t) => { text = t || ""; });

  document.getElementById('search').addEventListener('click', () => window.orb.toolbarAction('search', text));
  document.getElementById('translate').addEventListener('click', () => window.orb.toolbarAction('translate', text));
  document.getElementById('send').addEventListener('click', () => window.orb.toolbarAction('send', text));

  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.orb.toolbarHide(); });
  document.addEventListener('mouseleave', () => window.orb.toolbarHide());
</script>
</body>
</html>
