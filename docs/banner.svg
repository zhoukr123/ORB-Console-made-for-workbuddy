<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#11203a"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#4cc2ff"/>
      <stop offset="0.6" stop-color="#1b6fb0"/>
      <stop offset="1" stop-color="#0e3a5c"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#1c3a5e" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>
  <circle cx="250" cy="160" r="92" fill="url(#orb)" stroke="#7fd8ff" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="250" cy="160" r="62" fill="none" stroke="#bfeaff" stroke-width="1.5" opacity="0.6"/>
  <text x="250" y="182" fill="#eaf6ff" font-size="72" font-weight="800" text-anchor="middle" font-family="Arial">O</text>
  <text x="400" y="150" fill="#f0f6fc" font-size="56" font-weight="800">ORB 控制台</text>
  <text x="402" y="200" fill="#8fb8d8" font-size="24">一个真的会替你操作电脑的桌面 AI 员工</text>
  <text x="402" y="238" fill="#5c7a93" font-size="18">Desktop AI employee that actually operates your computer</text>
</svg>
